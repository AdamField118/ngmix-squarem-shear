# SuperBIT PSFEx models: 50 exposures, positions drawn over each model's
# fitted range, cycling through the files so each is used equally.
seed: 4000
psf:
  source: superbit
  files: psf_data/emp_psfs_best/psfex-output/*.psf
  native_pixel_scale: 0.141   # arcsec/pixel; check against the PSFEx headers
  npool: 1000                 # 20 positions per file
galaxies:
  source: cosmos
  sample: '25.2'
  # COSMOS fluxes are HST/ACS counts per second; (0.5 m / 2.4 m)^2 x 300 s.
  # Tune with the s/n quantiles printed by collect.
  flux_scale: 13.0
image:
  pixel_scale: 0.141
  stamp_size: 48
  # galaxies whose FFT would exceed this are redrawn (decided before
  # shearing, so no shear-dependent selection)
  max_fft_size: 4096
  # set so the 5th-percentile s/n is ~10 (median ~30) in a 50-galaxy test
  noise_sigma: 0.14
metacal:
  psf: dilate          # as in SuperBIT production
  gal_model: gauss
  step: 0.01
  ntry: 20
selection:
  # cut on the true flux (no shear-dependent selection); tune with the s/n
  # quantiles printed by collect
  min_true_flux: 0.0
shear:
  g: 0.02
arms:
  # reference: the same em5 model run to tight convergence, so arms differ
  # only in how far the PSF fit has converged
  - name: em5_converged
    ngauss: 5
    em: {tol: 1.0e-10, maxiter: 50000, accelerate: true}
  # ngmix defaults
  - name: em5_default
    ngauss: 5
    em: {tol: 1.0e-5, maxiter: 500}
  # the SuperBIT production settings
  - name: em5_superbit
    ngauss: 5
    em: {tol: 1.0e-6, maxiter: 50000}
  # same tol and maxiter, accelerated
  - name: em5_squarem
    ngauss: 5
    em: {tol: 1.0e-6, maxiter: 50000, accelerate: true}
